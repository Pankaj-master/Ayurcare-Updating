<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ayurvedic Food Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f7f0;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #8b5a2b;
      margin-bottom: 20px;
    }
    .controls {
      text-align: center;
      margin: 20px 0;
    }
    input, button {
      padding: 8px 12px;
      margin: 5px;
      font-size: 16px;
    }
    button {
      background-color: #8b5a2b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #6b4521;
    }
    .food-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .food-name {
      font-size: 22px;
      color: #8b5a2b;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      background: #e8f4f8;
      color: #007acc;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin: 2px;
    }
    .allergy-warning {
      background: #ffebee;
      color: #c62828;
    }
    .prakriti-pacifying {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .prakriti-aggravating {
      background: #ffebee;
      color: #c62828;
    }
    .prakriti-neutral {
      background: #f5f5f5;
      color: #616161;
    }
    .time-info {
      margin: 10px 0;
      font-style: italic;
      color: #555;
    }
    .ayurveda, .prakriti {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #ddd;
    }
    .ayurveda h4, .prakriti h4 {
      margin: 8px 0 4px;
      color: #2e7d32;
    }
    .hidden {
      display: none;
    }
    #loading {
      text-align: center;
      color: #8b5a2b;
    }
    #error {
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🌿 Ayurvedic Food Generator</h1>

  <div class="controls">
    <label for="numItems">Number of foods (1–50):</label>
    <input type="number" id="numItems" min="1" max="50" value="3" />
    <button onclick="loadFoods()">Generate</button>
  </div>

  <div id="loading" class="hidden">Loading recipes...</div>
  <div id="error" class="hidden"></div>
  <div id="results"></div>

  <script>
    // Helper: get CSS class based on prakriti effect
    function getPrakritiClass(effect) {
      if (effect === 'pacifying') return 'prakriti-pacifying';
      if (effect === 'aggravating') return 'prakriti-aggravating';
      return 'prakriti-neutral';
    }

    // Fetch and display n random foods
    async function loadFoods() {
      const n = parseInt(document.getElementById('numItems').value) || 3;
      if (n < 1 || n > 50) {
        alert("Please enter a number between 1 and 50.");
        return;
      }

      const loading = document.getElementById('loading');
      const errorDiv = document.getElementById('error');
      const results = document.getElementById('results');

      loading.classList.remove('hidden');
      errorDiv.classList.add('hidden');
      results.innerHTML = '';

      try {
        const response = await fetch('ayurvedic_recipes.json');
        if (!response.ok) throw new Error('Failed to load data');
        const allFoods = await response.json();

        // Get n random unique items
        const shuffled = [...allFoods].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, n);

        results.innerHTML = selected.map(food => `
          <div class="food-card">
            <div class="food-name">${food.name}</div>
            <div><strong>Type:</strong> ${food.type}</div>
            <div><strong>Ingredients:</strong> ${food.ingredients.join(', ')}</div>
            <div><strong>Instructions:</strong> ${food.instructions}</div>
            
            <div class="time-info">
              ⏱️ Prep: ${food.preparation_time_min} min | 
              Cook: ${food.cooking_time_min} min | 
              Serves: ${food.servings}
            </div>

            <div>
              <strong>Allergy Info:</strong> 
              ${food.allergy_info && food.allergy_info.length > 0 && food.allergy_info[0] !== 'none' 
                ? food.allergy_info.map(a => 
                    `<span class="tag allergy-warning">${a}</span>`
                  ).join(' ')
                : '<span class="tag">none</span>'
              }
            </div>

            <div class="ayurveda">
              <h4>Ayurvedic Properties</h4>
              <div><strong>Rasa (Taste):</strong> ${food.ayurveda.rasa.map(r => `<span class="tag">${r}</span>`).join(' ')}</div>
              <div><strong>Guna (Qualities):</strong> ${food.ayurveda.guna.map(g => `<span class="tag">${g}</span>`).join(' ')}</div>
              <div><strong>Virya (Energy):</strong> <span class="tag">${food.ayurveda.virya}</span></div>
            </div>

            <div class="prakriti">
              <h4>Dosha Suitability (Prakriti)</h4>
              <div><strong>Vata:</strong> <span class="tag ${getPrakritiClass(food.prakriti.vata)}">${food.prakriti.vata}</span></div>
              <div><strong>Pitta:</strong> <span class="tag ${getPrakritiClass(food.prakriti.pitta)}">${food.prakriti.pitta}</span></div>
              <div><strong>Kapha:</strong> <span class="tag ${getPrakritiClass(food.prakriti.kapha)}">${food.prakriti.kapha}</span></div>
            </div>
          </div>
        `).join('');

        loading.classList.add('hidden');
      } catch (err) {
        loading.classList.add('hidden');
        errorDiv.textContent = '❌ Error: ' + err.message;
        errorDiv.classList.remove('hidden');
        console.error(err);
      }
    }

    // Load 3 foods on page load
    window.onload = () => {
      setTimeout(loadFoods, 300);
    };
  </script>
</body>
</html>
